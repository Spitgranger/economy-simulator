[package]
name = "econsim"
version = "0.1.0"
edition = "2021"
description = "Agent-based economy engine with government policy, resource-constrained construction, and optional native graphics"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
macroquad = { version = "0.4.14", optional = true, default-features = false }

[features]
desktop = ["dep:macroquad"]

[profile.release]
opt-level = 3
debug = 1
